<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hold the Front Page</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#14121f;--panel:#201c35;--edge:#4a4270;--ink:#fff6e0;--dim:#b3abd0;--gold:#F5C04A;--violet:#9B7BFF;--good:#3ecf7a;--bad:#ff5a4d;
 --fact:#2F6FED;--opinion:#F28A1E;--informed:#1FA37A;--loaded:#D6336C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;
 font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;font-weight:800;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#cv{position:fixed;inset:0;display:block}
button{font:inherit;font-weight:800;color:inherit;cursor:pointer}
.hide{display:none!important}

/* screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:max(16px,env(safe-area-inset-top)) 16px 16px;background:radial-gradient(circle at 50% 30%,#2a2450,#14121f 70%);overflow:auto;touch-action:pan-y}
.logo{font-size:clamp(34px,8vw,64px);line-height:.95;letter-spacing:-.02em;text-align:center;text-transform:uppercase}
.logo span{color:var(--gold)}
.sub{color:var(--dim);font-weight:700;text-align:center;max-width:34ch}
.card{background:var(--panel);border:3px solid var(--edge);border-radius:18px;padding:16px;width:min(520px,100%)}
input[type=text]{width:100%;font:inherit;font-weight:800;font-size:22px;padding:12px 14px;border-radius:12px;border:3px solid var(--edge);background:#120f20;color:var(--ink);-webkit-user-select:text;user-select:text}
.tables{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.tbtn{padding:16px 0;font-size:26px;border-radius:14px;border:3px solid var(--edge);background:#120f20}
.tbtn.on{background:var(--gold);color:#1a1020;border-color:#fff}
.big{padding:16px 30px;font-size:26px;border-radius:16px;border:3px solid #000;background:var(--gold);color:#1a1020;box-shadow:0 5px 0 #8a6414;min-width:220px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #8a6414}
.big.ready{background:var(--good);box-shadow:0 5px 0 #17703f}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(620px,100%)}
.how div{background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:10px 6px;text-align:center;font-size:14px;line-height:1.15}
.how b{display:block;font-size:26px;margin-bottom:2px}
ul.roster{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
ul.roster li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#120f20;font-size:18px}
ul.roster li.off{opacity:.4}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.tick{margin-left:auto;color:var(--good)}
.msg{color:var(--dim);font-weight:700;text-align:center;min-height:1.3em}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#score{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:stretch;gap:0;border-radius:14px;overflow:hidden;border:3px solid #000;background:#000;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.tm{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:clamp(14px,2.2vw,20px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.tm span{font-size:clamp(22px,3.6vw,34px);min-width:1.2em;text-align:center}
#tm0{background:#ff2b2b}#tm1{background:#1f6bff}
.tm.me{outline:4px solid #fff;outline-offset:-4px}
#clock{padding:6px 14px;font-size:clamp(18px,2.8vw,26px);display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:92px;font-variant-numeric:tabular-nums}
#clock small{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.05em}
#banner{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 62px);left:50%;transform:translateX(-50%);width:min(560px,92vw);text-align:center;background:rgba(20,18,31,.92);border:3px solid var(--ink);border-radius:16px;padding:8px 14px 12px}
#banner small{display:block;color:var(--dim);font-size:12px;letter-spacing:.08em;font-weight:800}
#btext{font-size:clamp(20px,3.6vw,30px);line-height:1.15}
#toasts{position:absolute;left:50%;top:38%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(560px,92vw)}
.toast{padding:8px 16px;border-radius:14px;font-size:clamp(18px,3vw,26px);background:rgba(20,18,31,.92);border:3px solid var(--ink);text-align:center;animation:pop .25s ease-out}
.toast.good{border-color:var(--good);color:var(--good)}.toast.bad{border-color:var(--bad);color:var(--bad)}
.toast.feed{font-size:15px;padding:4px 10px;border-width:2px;color:var(--dim);border-color:var(--edge)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#fb{position:absolute;left:50%;top:30%;transform:translateX(-50%);width:min(520px,92vw);border-radius:18px;border:4px solid #000;overflow:hidden;animation:pop .2s ease-out}
#fb .h{padding:10px 16px;font-size:clamp(22px,4vw,32px);color:#fff}
#fb .b{background:#fff6e0;color:#1a1020;padding:10px 16px 14px;font-size:clamp(16px,2.6vw,20px);line-height:1.25}
#fb.ok .h{background:var(--good);color:#06301b}#fb.bad .h{background:var(--bad)}
#fb q{display:block;font-size:.9em;margin-bottom:6px;color:#444;font-weight:700}
#mm{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));width:min(272px,30vw);height:min(136px,15vw);border:3px solid #000;border-radius:10px;background:#000;opacity:.9}
#quitBtn{position:absolute;right:calc(max(10px,env(safe-area-inset-right)) + 58px);top:max(8px,env(safe-area-inset-top));height:48px;padding:0 14px;border-radius:24px;border:3px solid var(--ink);background:rgba(20,18,31,.85);font-size:15px;pointer-events:auto}
#helpBtn{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:rgba(20,18,31,.85);font-size:24px;pointer-events:auto}
#help{position:absolute;right:max(10px,env(safe-area-inset-right));top:64px;width:min(330px,80vw);background:rgba(20,18,31,.96);border:3px solid var(--edge);border-radius:14px;padding:10px 12px;pointer-events:auto;font-size:15px;line-height:1.25}
#help div{display:flex;gap:8px;align-items:center;margin:4px 0}
#help i{flex:none;width:12px;height:12px;border-radius:3px}
#help b{min-width:92px}
#dropBtn{position:absolute;right:max(34px,env(safe-area-inset-right));bottom:calc(max(24px,env(safe-area-inset-bottom)) + 128px);width:72px;height:72px;border-radius:50%;border:4px solid #000;background:var(--bad);color:#fff;font-size:15px;pointer-events:auto;box-shadow:0 5px 0 #8c1f17}
#powerBtn{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));width:106px;height:106px;border-radius:50%;border:4px solid #000;background:#ffd23f;color:#1a1020;font-size:15px;line-height:1.05;pointer-events:auto;box-shadow:0 5px 0 #a8860f}
#powerBtn.H{background:#4fc3f7;box-shadow:0 5px 0 #1f7fa8}
#powerBtn:active{transform:translateY(3px)}
#powerBtn b{display:block;font-size:34px;line-height:1}
#powerBar{position:absolute;right:calc(max(22px,env(safe-area-inset-right)) + 108px);bottom:max(26px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap-reverse;max-width:calc(100vw - 280px);pointer-events:none}
.pw{width:74px;height:74px;border-radius:50%;border:4px solid #000;color:#1a1020;font-size:11px;line-height:1;box-shadow:0 4px 0 rgba(0,0,0,.5);pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.pw b{font-size:28px;line-height:1.05}.pw i{font-style:normal;font-size:10px;opacity:.7;margin-top:1px}
.pw.dim{opacity:.35;filter:grayscale(.6)}.pw:active{transform:translateY(3px)}
#roles{display:flex;gap:10px;width:min(520px,100%)}
.role{flex:1;padding:12px 10px;border-radius:14px;border:3px solid var(--edge);background:#120f20;text-align:center;font-size:15px;line-height:1.15}
.role b{display:block;font-size:20px;margin-bottom:3px}.role small{display:block;color:var(--dim);font-weight:700;font-size:12px}
.role .rk{display:flex;flex-direction:column;gap:5px;text-align:left;margin-top:6px}.role .pl{display:flex;gap:8px;align-items:center;font-size:13px;line-height:1.1;font-weight:700}.role .pl b{display:inline;font-size:13px;margin:0}.role .pl i{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px}
.role.on{background:var(--gold);color:#1a1020;border-color:#fff}.role.on small{color:#3a2a10}
#explore{position:absolute;left:max(10px,env(safe-area-inset-left));top:min(160px,17vw);width:min(300px,40vw);background:rgba(20,18,31,.72);border:3px solid var(--gold);border-radius:16px;padding:10px 14px 12px;font-size:14px;line-height:1.25;pointer-events:none}
#explore h3{margin:0 0 4px;font-size:18px;color:var(--gold);letter-spacing:.04em}
#explore div{margin:5px 0}
#xtime{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 64px);transform:translateX(-50%);background:var(--gold);color:#1a1020;border:3px solid #000;border-radius:14px;padding:4px 18px;font-size:clamp(18px,3vw,26px);pointer-events:none;text-align:center}
.pw .n{position:absolute;right:-4px;top:-4px;min-width:24px;height:24px;border-radius:12px;background:#000;color:#fff;font-size:13px;line-height:24px;padding:0 4px}
.pw{position:relative}
#zone{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:6px 18px;border-radius:14px;border:3px solid #000;font-size:15px;letter-spacing:.08em;color:#1a1020;text-align:center;line-height:1.15;opacity:.92;pointer-events:none}
#zone small{display:block;font-size:11px;letter-spacing:.04em;opacity:.8}
#alerts{position:absolute;left:max(10px,env(safe-area-inset-left));top:calc(max(8px,env(safe-area-inset-top)) + min(148px,16vw));display:flex;flex-direction:column;gap:6px;pointer-events:none}
#alerts div{padding:6px 12px;border-radius:12px;border:3px solid #000;font-size:15px;color:#fff;max-width:230px}
#alerts .en{background:#c4161c;animation:siren .7s infinite alternate}#alerts .my{background:#1f7a46}
@keyframes siren{from{box-shadow:0 0 0 0 rgba(255,60,60,.9)}to{box-shadow:0 0 18px 6px rgba(255,60,60,.9)}}
#pstat{position:absolute;left:max(10px,env(safe-area-inset-left));top:calc(max(8px,env(safe-area-inset-top)) + min(148px,16vw) + 96px);display:flex;flex-direction:column;gap:6px}
#pstat div{padding:4px 10px;border-radius:10px;border:3px solid #000;font-size:15px;color:#1a1020}
#tiedBox{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);width:min(520px,92vw);text-align:center;background:rgba(160,24,24,.94);border:4px solid #000;border-radius:18px;padding:12px 16px;animation:pop .2s ease-out}
#tiedBox b{display:block;font-size:clamp(28px,6vw,46px);line-height:1}
#tiedBox span{font-size:clamp(15px,2.6vw,20px);font-weight:700}
#dropBtn:active{transform:translateY(3px)}
#joyBase{position:fixed;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;border:4px solid rgba(255,246,224,.55);background:rgba(255,246,224,.12)}
#joyKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,246,224,.7);border:3px solid #fff}
#joyHint{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:100px;height:100px;border-radius:50%;border:4px dashed rgba(255,246,224,.35);display:flex;align-items:center;justify-content:center;color:rgba(255,246,224,.55);font-size:13px;text-align:center;line-height:1.1}
#reveal{position:absolute;inset:0;background:rgba(10,8,20,.74);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
#reveal .team{font-size:clamp(34px,8vw,72px);line-height:1}
#votes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:700px;pointer-events:auto}
#votes button{padding:10px 14px;border-radius:12px;border:3px solid #000;background:#201c35;color:#fff;font-size:17px}
#votes button.on{background:var(--gold);color:#1a1020;border-color:#fff}#votes small{display:block;font-size:12px;opacity:.85}
#reveal .count{font-size:clamp(60px,14vw,130px);line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px}
.chip{padding:6px 12px;border-radius:10px;font-size:16px;color:#fff;border:3px solid #000;line-height:1.1;text-align:left}
.chip small{display:block;font-weight:700;opacity:.9;font-size:12px}
.chip.F{background:var(--fact)}.chip.O{background:var(--opinion);color:#1a1020}.chip.I{background:var(--informed)}.chip.L{background:var(--loaded)}
#reconnect{position:fixed;left:50%;top:10px;transform:translateX(-50%);background:var(--bad);padding:6px 14px;border-radius:10px;z-index:9}

/* over */
.win{font-size:clamp(34px,8vw,64px);line-height:1;text-align:center}
.scoreline{display:flex;gap:14px;align-items:center;font-size:clamp(26px,6vw,48px)}
.scoreline span{padding:4px 16px;border-radius:12px;color:#1a1020}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(720px,100%)}
.mini{background:var(--panel);border:3px solid var(--edge);border-radius:14px;padding:12px;font-size:16px;line-height:1.3}
.mini h3{margin:0 0 6px;font-size:14px;letter-spacing:.08em;color:var(--dim)}
.rev{width:min(720px,100%);display:flex;flex-direction:column;gap:8px}
.rev div{background:var(--panel);border-left:8px solid var(--edge);border-radius:10px;padding:8px 12px;font-size:16px;line-height:1.25}
.rev b{display:block;font-size:18px}
.rev small{color:var(--dim);font-weight:700}
@media (max-width:620px){.how{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hide">
  <canvas id="mm" width="544" height="272"></canvas>
  <div id="score">
    <div class="tm" id="tm0"><b>HERALD</b><span id="s0">0</span></div>
    <div id="clock">5:00<small id="goal">FIRST TO 10</small></div>
    <div class="tm" id="tm1"><span id="s1">0</span><b>GAZETTE</b></div>
  </div>
  <div id="banner" class="hide"><small>YOU ARE CARRYING</small><div id="btext"></div></div>
  <div id="toasts"></div>
  <div id="fb" class="hide"></div>
  <button id="quitBtn" class="hide">MENU</button>
  <button id="helpBtn">?</button>
  <div id="help" class="hide"></div>
  <div id="joyHint">MOVE<br>drag anywhere</div>
  <div id="alerts"></div>
  <div id="pstat"></div>
  <div id="tiedBox" class="hide"><b>TIED UP!</b><span id="tiedTxt">A teammate can free you.</span></div>
  <div id="xtime" class="hide"></div>
  <div id="explore" class="hide"></div>
  <div id="powerBar"></div>
  <div id="zone"></div>
  <button id="dropBtn" class="hide">DROP</button>
  <div id="joyBase" class="hide"><div id="joyKnob"></div></div>
  <div id="reveal" class="hide"></div>
</div>

<div id="reconnect" class="hide">Reconnecting...</div>

<div class="screen" id="join">
  <div class="logo">Hold the<br><span>Front Page</span></div>
  <div class="how">
    <div><b>&#128377;</b>Drag to move</div>
    <div><b>&#128196;</b>Grab a card in the middle</div>
    <div><b>&#9989;</b>Run it to the right desk</div>
    <div><b>&#128168;</b>Don't get tagged</div>
  </div>
  <div class="card">
    <input type="text" id="realIn" maxlength="30" placeholder="Your real name (only your teacher sees it)" autocomplete="off" autocapitalize="words" style="margin-bottom:10px">
    <input type="text" id="nameIn" maxlength="12" placeholder="Display name (other players see this)" autocomplete="off" autocapitalize="words">
    <div class="tables" id="tables"></div>
  </div>
  <button class="big" id="joinBtn">JOIN</button>
  <div class="msg" id="joinMsg"></div>
</div>

<div class="screen hide" id="lobby">
  <div class="logo" style="font-size:clamp(26px,6vw,44px)">Table <span id="lobTable">A</span></div>
  <div class="sub" id="lobLevel"></div>
  <div class="card"><ul class="roster" id="roster"></ul></div>
  <div id="roles"></div>
  <button class="big" id="readyBtn">READY</button>
  <div class="msg" id="lobTeam" style="font-size:20px;font-weight:800"></div>
  <div class="msg" id="lobMsg"></div>
</div>

<div class="screen hide" id="over">
  <div class="win" id="winTxt"></div>
  <div class="scoreline" id="scoreLine"></div>
  <div class="cols"><div class="mini" id="starBox"></div><div class="mini" id="teamBox"></div></div>
  <div class="rev" id="rev"></div>
  <div id="rolesOver"></div>
  <button class="big" id="againBtn">READY AGAIN</button>
</div>

<script type="module">
import { W, H, T, MAP, CFG, KINDS, MODES, POWERS, POWER_KEYS, ROLES, ZONES, zoneAt, step, los, cellAt, solid, TEAMS } from './shared.js';

const $ = (id) => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const fogCv = document.createElement('canvas'), fctx = fogCv.getContext('2d');
const mm = $('mm'), mctx = mm.getContext('2d');
let DPR = 1, VW = 0, VH = 0, TS = 40;

const KCOL = { F: '#2F6FED', O: '#F28A1E', I: '#1FA37A', L: '#D6336C' };
const MD = () => MODES[S.mode] || MODES.fo;
const KN = (k) => MD().names[k] || { name: k, sub: '' };
const kindOpen = (k) => MD().kinds.includes(k);
const TUBE_COLS = ['#ff7043', '#29b6f6', '#ab47bc', '#66bb6a', '#ffee58', '#ec407a'];

/* ---------------- sound ---------------- */
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* none */ } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type = 'square', vol = 0.06, when = 0, slide = 0) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.02);
}
const SFX = {
  pick() { tone(520, .08, 'square', .05); tone(780, .1, 'square', .05, .07); },
  drop() { tone(300, .12, 'triangle', .06, 0, -120); },
  ok() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .14, 'square', .06, i * .07)); },
  bad() { tone(160, .35, 'sawtooth', .08, 0, -90); tone(150, .35, 'square', .05, .05, -80); },
  tag() { tone(220, .2, 'sawtooth', .08, 0, -150); },
  tube() { tone(300, .25, 'sine', .08, 0, 600); },
  tick() { tone(660, .08, 'square', .05); },
  free() { [392, 523, 659].forEach((f, i) => tone(f, .12, 'triangle', .07, i * .07)); },
  blast() { tone(700, .4, 'sawtooth', .07, 0, -500); tone(200, .3, 'square', .05, .05, -100); },
  radar() { tone(500, .1, 'sine', .07); tone(750, .1, 'sine', .07, .12); tone(1000, .2, 'sine', .06, .24); },
  snip() { tone(1200, .05, 'square', .06); tone(900, .08, 'square', .06, .07); },
  sprint() { tone(300, .35, 'sawtooth', .05, 0, 700); },
  shield() { tone(880, .12, 'triangle', .07); tone(1320, .2, 'triangle', .06, .08); },
  siren() { tone(880, .18, 'sawtooth', .06); tone(660, .18, 'sawtooth', .06, .2); tone(880, .18, 'sawtooth', .06, .4); },
  ping() { tone(990, .09, 'sine', .035); tone(1480, .12, 'sine', .025, .07); },
  steal() { tone(500, .1, 'square', .06); tone(250, .2, 'sawtooth', .07, .08, -100); },
  go() { tone(880, .35, 'square', .07); tone(1320, .4, 'square', .06, .12); },

/* ---------------- network ---------------- */
let retry = 0;
function connect() {
  if (S.ws) { try { S.ws.close(); } catch (e) { /* */ } }

  $('joinMsg').textContent = 'Connecting...';
  ws.onopen = () => { retry = 0; $('reconnect').classList.add('hide'); ws.send(JSON.stringify({ t: 'hello', name: store.get('htfp_name', 'Player'), real: store.get('htfp_real', ''), token: store.get('htfp_token_' + S.table, '') })); };
  ws.onmessage = (e) => { try { onMsg(JSON.parse(e.data)); } catch (err) { console.error(err); } };
  ws.onclose = () => { if (S.ws !== ws) return; if (S.screen !== 'join') $('reconnect').classList.remove('hide'); setTimeout(() => { if (S.ws === ws && S.screen !== 'join') connect(); }, Math.min(4000, 400 + retry++ * 600)); };
}
const send = (o) => { if (S.ws && S.ws.readyState === 1) S.ws.send(JSON.stringify(o)); };

function onMsg(m) {

function onSnap(m) {
  S.ec = m.ec || 0; S.mc = m.mc || 0; S.score = m.sc; S.left = m.left; S.cards = m.cards; S.pups = m.pu || [];
  const now = performance.now();

      S.carrying = !!q.c; S.ct = q.ct || null; S.stun = q.s; S.grace = q.g; S.hide = !!q.h; S.tied = !!q.t; S.pw = q.pw || []; S.spt = q.spt || 0; S.sht = q.sht || 0; S.rc = q.rc || 0; S.tt = q.tt || 0; S.ex = q.ex || 0; if (q.rl) S.role = q.rl; S.frz = q.fz ? 1 : 0; S.rd = q.rd || 0;
      if (!S.meInit) { S.me.x = q.x; S.me.y = q.y; S.meInit = true; }
      const dx = q.x - S.me.x, dy = q.y - S.me.y, d = Math.hypot(dx, dy);
      if (q.s > 0 || q.t || q.fz || d > 2.5) { S.me.x = q.x; S.me.y = q.y; } else if (d > 1.0) { S.me.x += dx * 0.35; S.me.y += dy * 0.35; }

      o.tx = q.x; o.ty = q.y; o.a = q.a; o.m = q.m; o.s = q.s; o.g = q.g; o.h = q.h; o.c = q.c; o.t = q.t; o.sp = q.sp; o.sh = q.sh; o.ct = q.ct || null; o.fz = q.fz; o.seen = now;

}

function onEvent(e) {
  S.evc = S.evc || {}; S.evc[e.k] = (S.evc[e.k] || 0) + 1;
  const nm = (id) => (S.players[id] ? S.players[id].name : '?');
  switch (e.k) {
    case 'ping': S.pings.push({ x: e.x, y: e.y, t: performance.now() }); if (S.pings.length > 14) S.pings.shift(); if (S.phase === 'play') SFX.ping(); break;
    case 'pick': SFX.pick(); break;
    case 'carry': if (S.phase === 'play') { if (e.team !== S.team) { SFX.siren(); S.alertFlash = performance.now(); } } break;
    case 'drop': SFX.drop(); break;
    case 'tube': SFX.tube(); S.me.x = e.x; S.me.y = e.y; S.flash = 0.25; if (e.raid) { const home = (e.x < W / 2) === (S.team === 0); toast(home ? 'Back in YOUR territory' : 'RAID! You are in their territory', home ? 'feed' : 'good', 1800); } break;
    case 'raidno': toast(e.why === 'carry' ? 'No cards through the raid portal' : 'Raid portal recharging ' + Math.ceil(e.cd) + 's', 'bad', 1400); break;
    case 'ok': {
      const mine = S.players[e.p] && S.players[e.p].team === S.team;
      if (e.p !== S.you) toast(mine ? `+1 ${nm(e.p)} scored!` : `${nm(e.p)} scored for ${TEAMS[e.team].name}`, mine ? 'good' : 'feed', 1600);
      const d = MAP.desks.find((q) => q.team === e.team && q.kind === e.kind); if (d) burst((d.x0 + d.x1) / 2, (d.y0 + d.y1) / 2, KCOL[e.kind], 24);
      break;
    }
    case 'ok2': SFX.ok(); feedback('ok', 'GOT IT! +1', e.text, e.w); break;
    case 'bad': SFX.bad(); S.shake = 0.5; feedback('bad', 'NOT QUITE', e.text, `That was ${KN(e.c).name}. ${e.w}`); break;
    case 'tag': {
      const by = e.by === S.you, who = e.who === S.you;
      if (who) { SFX.tag(); S.shake = 0.5; }
      else if (by) { SFX.steal(); toast(`You stole ${nm(e.who)}'s card!`, 'good', 1800); }
      else toast(`${nm(e.by)} stole from ${nm(e.who)}`, 'feed', 1600);
      burst(e.x, e.y, '#ffffff', 14);
      break;
    }
    case 'free': {
      const by = e.by === S.you, who = e.who === S.you;
      if (e.self) { if (who) { SFX.free(); toast('You broke free!', 'good', 1800); } else toast(`${nm(e.who)} broke free`, 'feed', 1400); break; }
      if (who) { SFX.free(); toast(`${nm(e.by)} freed you!`, 'good', 1800); }
      else if (by) { SFX.free(); toast(`You freed ${nm(e.who)}!`, 'good', 1500); }
      else toast(`${nm(e.by)} freed ${nm(e.who)}`, 'feed', 1400);
      break;
    }
    case 'freeall': toast('The rope loosens. Everyone is free!', 'feed', 2200); break;
    case 'use':
      if (e.kind === 'S') { SFX.sprint(); S.spt = CFG.sprintSecs; } else if (e.kind === 'H') { SFX.shield(); S.sht = CFG.shieldSecs; } else if (e.kind === 'B') { SFX.snip(); toast('SNIP! The rope is cut a bit', 'good', 1200); }
      break;
    case 'blast': {
      SFX.blast(); burst(e.x, e.y, '#b388ff', 26); burst(e.x, e.y, '#ffffff', 10);
      const bp = S.players[e.by];
      if (bp && bp.team !== S.team && Math.hypot(e.x - S.me.x, e.y - S.me.y) <= CFG.blastR) { S.shake = 0.4; toast(`FROZEN by ${nm(e.by)}!`, 'bad', 1600); }
      else if (e.by === S.you) toast('BLAST!', 'good', 1000);
      break;
    }
    case 'radar': SFX.radar(); if (e.team === S.team) toast('RADAR: every enemy is marked!', 'good', 1800); else toast('Enemy RADAR! They can see you', 'bad', 1800); break;
    case 'nonet': toast('NET: nobody in range', 'bad', 1000); break;
    case 'net': { SFX.blast(); S.beams = S.beams || []; S.beams.push({ x: e.x, y: e.y, tx: e.tx, ty: e.ty, t: performance.now() }); burst(e.tx, e.ty, '#ff6bd6', 20); const bp = S.players[e.by], wp = S.players[e.who]; if (e.who === S.you) { S.shake = .4; toast(`NETTED by ${nm(e.by)}!`, 'bad', 1600); } else if (e.by === S.you) toast(`NET! ${nm(e.who)} is stuck`, 'good', 1400); else if (bp && wp && bp.team === S.team) toast(`${nm(e.by)} netted ${nm(e.who)}`, 'feed', 1200); break; }
    case 'pup': SFX.pick(); toast(`Got ${POWERS[e.kind].name}!`, 'good', 1200); break;
    case 'shield': {
      if (e.who === S.you) toast(`SHIELD blocked ${nm(e.by)}!`, 'good', 1600); else if (e.by === S.you) { SFX.bad(); toast(`${nm(e.who)} had a shield!`, 'bad', 1600); } else toast(`${nm(e.who)}'s shield blocked ${nm(e.by)}`, 'feed', 1400);
      SFX.shield(); burst(e.x, e.y, '#4fc3f7', 16);

    }
    default: break;
  }
}

/* ---------------- toasts ---------------- */

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ---------------- input: floating joystick ---------------- */
const joy = { id: null, bx: 0, by: 0, x: 0, y: 0 };
const keys = {};
const R = 60;
function joyDown(e) {
  if (S.screen !== 'game' || e.target.closest('button') || joy.id !== null) return;
  audio();
  joy.id = e.pointerId; joy.bx = e.clientX; joy.by = e.clientY; joy.x = joy.y = 0;
  const b = $('joyBase'); b.style.left = joy.bx + 'px'; b.style.top = joy.by + 'px'; b.classList.remove('hide'); $('joyKnob').style.transform = 'translate(0,0)';
  $('joyHint').classList.add('hide');
}
function joyMove(e) {
  if (e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.bx, dy = e.clientY - joy.by; const l = Math.hypot(dx, dy);
  if (l > R) { dx = dx / l * R; dy = dy / l * R; }
  $('joyKnob').style.transform = `translate(${dx}px,${dy}px)`;
  const mag = Math.min(1, l / R), dz = 0.12, out = mag < dz ? 0 : (mag - dz) / (1 - dz);
